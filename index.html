<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classeo</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.logo{
    position:fixed;
    top:20px;
    left:25px;
    font-size:28px;
    font-weight:800;
    color:white;
    letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,0.3);
}

.signature{
    position:fixed;
    bottom:10px;
    right:15px;
    font-size:11px;
    color:rgba(255,255,255,0.75);
    user-select:none;
}

.container{
    width:100%;
    max-width:850px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    color:white;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

h2{
    text-align:center;
    margin-bottom:15px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    outline:none;
    border-radius:12px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#6366f1;
    transform:translateY(-2px);
}

.resultat{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
    min-height:100px;
}

.hidden{
    display:none;
}

.info{
    text-align:center;
    margin-bottom:15px;
    opacity:.9;
}
</style>
</head>
<body>

<div class="logo">
    Classeo
</div>

<div class="container">

<h1>📚 Conseil de Classe</h1>

<div id="connexion">

<p class="info">
Connectez-vous avec votre code personnel.
</p>

<input
type="text"
id="code"
placeholder="Code d'accès">

<button onclick="connexion()">
Se connecter
</button>

</div>

<div id="espaceEleve" class="hidden">

<h2 id="nomEleve"></h2>

<select id="trimestre" onchange="afficherResultat()">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<div id="resultat" class="resultat">
Aucune information.
</div>

<button onclick="deconnexion()">
Déconnexion
</button>

</div>

<div id="admin" class="hidden">

<h2>🔒 Administration</h2>

<button onclick="ajouterEleve()">
➕ Ajouter un élève
</button>

<select id="choixEleve"></select>

<select id="choixTrimestre">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<textarea
id="texteResultat"
placeholder="Résultat du conseil de classe...">
</textarea>

<button onclick="enregistrer()">
💾 Enregistrer
</button>

<button onclick="supprimerEleve()">
🗑️ Supprimer l'élève
</button>

<button onclick="deconnexion()">
Déconnexion
</button>

</div>

</div>

<div class="signature">
    @classeConnecte
</div>

<script>

const ADMIN_CODE = "ADMIN2026";

let eleves =
JSON.parse(localStorage.getItem("eleves")) || {};

let utilisateurActuel = null;

sauvegarderLocal();

function sauvegarderLocal(){
    localStorage.setItem(
        "eleves",
        JSON.stringify(eleves)
    );
}

function connexion(){

    const code =
    document.getElementById("code")
    .value
    .trim();

    if(code === ADMIN_CODE){

        document
        .getElementById("connexion")
        .classList.add("hidden");

        document
        .getElementById("admin")
        .classList.remove("hidden");

        chargerListeEleves();

        return;
    }

    if(eleves[code]){

        utilisateurActuel = code;

        document
        .getElementById("connexion")
        .classList.add("hidden");

        document
        .getElementById("espaceEleve")
        .classList.remove("hidden");

        document
        .getElementById("nomEleve")
        .innerText =
        "Bonjour " + eleves[code].nom;

        afficherResultat();

    }else{

        alert("Code introuvable.");

    }
}

function afficherResultat(){

    const trimestre =
    document
    .getElementById("trimestre")
    .value;

    document
    .getElementById("resultat")
    .innerHTML =
    eleves[utilisateurActuel][trimestre]
    || "Aucune information disponible.";

}

function chargerListeEleves(){

    const liste =
    document.getElementById("choixEleve");

    liste.innerHTML = "";

    for(let code in eleves){

        liste.innerHTML += `
        <option value="${code}">
            ${eleves[code].nom} (${code})
        </option>
        `;
    }
}

function ajouterEleve(){

    const nom =
    prompt("Nom de l'élève :");

    if(!nom) return;

    const code =
    prompt("Code de connexion :");

    if(!code) return;

    if(eleves[code]){
        alert("Ce code existe déjà.");
        return;
    }

    eleves[code] = {
        nom: nom,
        T1: "",
        T2: "",
        T3: ""
    };

    sauvegarderLocal();
    chargerListeEleves();

    alert("Élève ajouté.");
}

function enregistrer(){

    const eleve =
    document.getElementById("choixEleve").value;

    if(!eleve){
        alert("Ajoute un élève d'abord.");
        return;
    }

    const trimestre =
    document.getElementById("choixTrimestre").value;

    const texte =
    document.getElementById("texteResultat").value;

    eleves[eleve][trimestre] = texte;

    sauvegarderLocal();

    alert("Résultat enregistré.");
}

function supprimerEleve(){

    const eleve =
    document.getElementById("choixEleve").value;

    if(!eleve) return;

    if(confirm(
        "Voulez-vous vraiment supprimer cet élève ?"
    )){

        delete eleves[eleve];

        sauvegarderLocal();

        chargerListeEleves();
    }
}

function deconnexion(){
    location.reload();
}

</script>

</body>
</html>
