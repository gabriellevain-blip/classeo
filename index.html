<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classeo</title>

<link rel="icon" href="favicon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.logo{
    position:fixed;
    top:20px;
    left:25px;
    font-size:30px;
    font-weight:800;
    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,0.3);
}

.signature{
    position:fixed;
    bottom:10px;
    right:15px;
    font-size:10px;
    color:rgba(255,255,255,0.8);
}

.container{
    width:100%;
    max-width:850px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    color:white;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:15px;
}

h3{
    margin-bottom:10px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#6366f1;
    transform:translateY(-2px);
}

.hidden{
    display:none;
}

.card{
    background:rgba(255,255,255,0.15);
    border-radius:15px;
    padding:20px;
    margin-top:15px;
}

.info{
    text-align:center;
    opacity:0.9;
    margin-bottom:10px;
}
</style>

</head>
<body>

<div class="logo">
Classeo
</div>

<div class="container">

<h1>📚 Conseil de Classe</h1>

<div id="connexion">

<p class="info">
Entrez votre code d'accès
</p>

<input
type="text"
id="code"
placeholder="Code d'accès">

<button onclick="connexion()">
Se connecter
</button>

</div>

<div id="espaceEleve" class="hidden">

<h2 id="nomEleve"></h2>

<select id="trimestre" onchange="afficherResultat()">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<div class="card">
<h3>📄 Résultat personnel</h3>
<p id="resultat">
Aucune information.
</p>
</div>

<div class="card">
<h3>🏫 Appréciation générale de la classe</h3>
<p id="appreciationClasseEleve">
Aucune appréciation disponible.
</p>
</div>

<button onclick="deconnexion()">
Déconnexion
</button>

</div>

<div id="admin" class="hidden">

<h2>🔒 Administration</h2>

<button onclick="ajouterEleve()">
➕ Ajouter un élève
</button>

<select id="choixEleve"></select>

<select id="choixTrimestre">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<textarea
id="texteResultat"
placeholder="Résultat individuel..."
></textarea>

<button onclick="enregistrer()">
💾 Enregistrer le résultat
</button>

<button onclick="supprimerEleve()">
🗑️ Supprimer l'élève
</button>

<div class="card">

<h3>🏫 Appréciation générale de la classe</h3>

<textarea
id="appreciationClasseAdmin"
placeholder="Appréciation générale..."
></textarea>

<button onclick="sauvegarderAppreciationClasse()">
📢 Enregistrer l'appréciation générale
</button>

</div>

<button onclick="deconnexion()">
Déconnexion
</button>

</div>

</div>

<div class="signature">
@classeConnecte
</div>

<script>

const ADMIN_CODE = "ADMIN2026";

let eleves =
JSON.parse(localStorage.getItem("eleves")) || {};

let appreciationClasse =
localStorage.getItem("appreciationClasse")
|| "Aucune appréciation générale disponible.";

let utilisateurActuel = null;

sauvegarderLocal();

function sauvegarderLocal(){
    localStorage.setItem(
        "eleves",
        JSON.stringify(eleves)
    );
}

function connexion(){

    const code =
    document.getElementById("code")
    .value.trim();

    if(code === ADMIN_CODE){

        document
        .getElementById("connexion")
        .classList.add("hidden");

        document
        .getElementById("admin")
        .classList.remove("hidden");

        document
        .getElementById("appreciationClasseAdmin")
        .value = appreciationClasse;

        chargerListeEleves();

        return;
    }

    if(eleves[code]){

        utilisateurActuel = code;

        document
        .getElementById("connexion")
        .classList.add("hidden");

        document
        .getElementById("espaceEleve")
        .classList.remove("hidden");

        document
        .getElementById("nomEleve")
        .innerText =
        "Bonjour " + eleves[code].nom;

        document
        .getElementById("appreciationClasseEleve")
        .innerText =
        appreciationClasse;

        afficherResultat();

    }
    else{

        alert("Code introuvable.");

    }
}

function afficherResultat(){

    const trimestre =
    document.getElementById("trimestre").value;

    document
    .getElementById("resultat")
    .innerText =
    eleves[utilisateurActuel][trimestre]
    || "Aucune information disponible.";

}

function chargerListeEleves(){

    const select =
    document.getElementById("choixEleve");

    select.innerHTML = "";

    for(let code in eleves){

        select.innerHTML += `
        <option value="${code}">
        ${eleves[code].nom} (${code})
        </option>
        `;
    }
}

function ajouterEleve(){

    const nom =
    prompt("Nom de l'élève");

    if(!nom) return;

    const code =
    prompt("Code de connexion");

    if(!code) return;

    if(eleves[code]){
        alert("Ce code existe déjà");
        return;
    }

    eleves[code] = {
        nom:nom,
        T1:"",
        T2:"",
        T3:""
    };

    sauvegarderLocal();
    chargerListeEleves();

    alert("Élève ajouté");
}

function enregistrer(){

    const eleve =
    document.getElementById("choixEleve").value;

    if(!eleve){
        alert("Ajoute un élève");
        return;
    }

    const trimestre =
    document.getElementById("choixTrimestre").value;

    const texte =
    document.getElementById("texteResultat").value;

    eleves[eleve][trimestre] = texte;

    sauvegarderLocal();

    alert("Résultat enregistré");
}

function supprimerEleve(){

    const eleve =
    document.getElementById("choixEleve").value;

    if(!eleve) return;

    if(confirm("Supprimer cet élève ?")){

        delete eleves[eleve];

        sauvegarderLocal();

        chargerListeEleves();
    }
}

function sauvegarderAppreciationClasse(){

    appreciationClasse =
    document.getElementById(
        "appreciationClasseAdmin"
    ).value;

    localStorage.setItem(
        "appreciationClasse",
        appreciationClasse
    );

    alert("Appréciation générale enregistrée");
}

function deconnexion(){
    location.reload();
}

</script>

</body>
</html>
