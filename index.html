<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classeo</title>
<link rel="icon" href="favicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.logo{
position:fixed;
top:20px;
left:25px;
font-size:30px;
font-weight:800;
color:white;
}
.signature{
position:fixed;
bottom:10px;
right:15px;
font-size:10px;
color:white;
opacity:.8;
}
.container{
width:100%;
max-width:850px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
color:white;
}
input,select,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}
button{
background:#4f46e5;
color:white;
cursor:pointer;
font-weight:bold;
}
button:hover{
background:#6366f1;
}
.hidden{display:none}
.card{
background:rgba(255,255,255,.15);
padding:15px;
margin-top:15px;
border-radius:15px;
}
h1,h2{text-align:center;margin-bottom:15px}
</style>
</head>
<body>

<div class="logo">Classeo</div>

<div class="container">

<h1>📚 Conseil de Classe</h1>

<div id="login">

<input id="code" placeholder="Code d'accès">

<button onclick="connexion()">
Connexion
</button>

</div>

<div id="eleve" class="hidden">

<h2 id="nomEleve"></h2>

<select id="trimestre" onchange="afficherResultat()">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<div class="card">
<h3>Résultat personnel</h3>
<p id="resultat"></p>
</div>

<div class="card">
<h3>🏫 Appréciation générale</h3>
<p id="appreciationClasseEleve"></p>
</div>

<button onclick="location.reload()">
Déconnexion
</button>

</div>

<div id="admin" class="hidden">

<h2>Administration</h2>

<button onclick="ajouterEleve()">
➕ Ajouter un élève
</button>

<select id="choixEleve"></select>

<select id="choixTrimestre">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<textarea id="texteResultat"
placeholder="Résultat individuel"></textarea>

<button onclick="enregistrerResultat()">
💾 Enregistrer résultat
</button>

<div class="card">

<h3>🏫 Appréciation générale</h3>

<textarea id="appreciationClasseAdmin"
placeholder="Appréciation générale"></textarea>

<button onclick="sauvegarderAppreciationClasse()">
📢 Enregistrer appréciation
</button>

</div>

<button onclick="supprimerEleve()">
🗑️ Supprimer élève
</button>

<button onclick="location.reload()">
Déconnexion
</button>

</div>

</div>

<div class="signature">@classeConnecte</div>

<script>

const ADMIN_CODE="ADMIN2026";

let eleves=
JSON.parse(localStorage.getItem("eleves"))||{};

let appreciations=
JSON.parse(localStorage.getItem("appreciations"))||{
T1:"",
T2:"",
T3:""
};

let utilisateur=null;

function saveEleves(){
localStorage.setItem(
"eleves",
JSON.stringify(eleves)
);
}

function saveAppreciations(){
localStorage.setItem(
"appreciations",
JSON.stringify(appreciations)
);
}

function connexion(){

const code=
document.getElementById("code").value.trim();

if(code===ADMIN_CODE){

document.getElementById("login")
.classList.add("hidden");

document.getElementById("admin")
.classList.remove("hidden");

chargerEleves();

document.getElementById(
"appreciationClasseAdmin"
).value=
appreciations[
document.getElementById(
"choixTrimestre"
).value
]||"";

return;
}

if(eleves[code]){

utilisateur=code;

document.getElementById("login")
.classList.add("hidden");

document.getElementById("eleve")
.classList.remove("hidden");

document.getElementById("nomEleve")
.innerText=
"Bonjour "+eleves[code].nom;

afficherResultat();

}else{
alert("Code incorrect");
}

}

function afficherResultat(){

const t=
document.getElementById(
"trimestre"
).value;

document.getElementById(
"resultat"
).innerText=
eleves[utilisateur][t]||
"Aucun résultat";

document.getElementById(
"appreciationClasseEleve"
).innerText=
appreciations[t]||
"Aucune appréciation";

}

function ajouterEleve(){

const nom=
prompt("Nom de l'élève");

if(!nom) return;

const code=
prompt("Code élève");

if(!code) return;

eleves[code]={
nom:nom,
T1:"",
T2:"",
T3:""
};

saveEleves();
chargerEleves();

}

function chargerEleves(){

const select=
document.getElementById(
"choixEleve"
);

select.innerHTML="";

for(let code in eleves){

select.innerHTML+=`
<option value="${code}">
${eleves[code].nom}
(${code})
</option>
`;

}

}

function enregistrerResultat(){

const eleve=
document.getElementById(
"choixEleve"
).value;

const trim=
document.getElementById(
"choixTrimestre"
).value;

const txt=
document.getElementById(
"texteResultat"
).value;

if(!eleve) return;

eleves[eleve][trim]=txt;

saveEleves();

alert("Enregistré");

}

function supprimerEleve(){

const eleve=
document.getElementById(
"choixEleve"
).value;

if(!eleve) return;

delete eleves[eleve];

saveEleves();

chargerEleves();

}

function sauvegarderAppreciationClasse(){

const trim=
document.getElementById(
"choixTrimestre"
).value;

appreciations[trim]=
document.getElementById(
"appreciationClasseAdmin"
).value;

saveAppreciations();

alert("Appréciation enregistrée");

}

document.addEventListener(
"DOMContentLoaded",
()=>{

const select=
document.getElementById(
"choixTrimestre"
);

if(select){

select.addEventListener(
"change",
function(){

document.getElementById(
"appreciationClasseAdmin"
).value=
appreciations[this.value]||"";

});

}

});

</script>

</body>
</html>
