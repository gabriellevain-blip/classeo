<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classeo</title>
<link rel="icon" href="favicon.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.logo{
position:fixed;
top:20px;
left:25px;
font-size:30px;
font-weight:800;
color:white;
}

.signature{
position:fixed;
bottom:10px;
right:15px;
font-size:10px;
color:white;
opacity:.8;
}

.container{
width:100%;
max-width:850px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
color:white;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#4f46e5;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#6366f1;
}

.hidden{
display:none;
}

.card{
background:rgba(255,255,255,.15);
padding:15px;
margin-top:15px;
border-radius:15px;
}
</style>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
  getMessaging,
  getToken
}
from
"https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  collection,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyD2X3tHdu9BBG6wiN7poyvsDWfrj95JlgU",
authDomain:"classeo-53f9d.firebaseapp.com",
projectId:"classeo-53f9d",
storageBucket:"classeo-53f9d.firebasestorage.app",
messagingSenderId:"371736144457",
appId:"1:371736144457:web:4539955acfa23071a12d98"
};

const app = initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.getDoc = getDoc;
window.getDocs = getDocs;
window.collection = collection;
window.deleteDoc = deleteDoc;
  
window.messaging =
getMessaging(app);

window.getToken =
getToken;

</script>

</head>
<body>

<div class="logo">
Classeo
</div>

<div class="container">

<h1>📚 Conseil de Classe</h1>

<div id="login">

<input
id="code"
placeholder="Code d'accès">

<button onclick="connexion()">
Connexion
</button>

</div>

<div id="eleve" class="hidden">

<h2 id="nomEleve"></h2>

<select id="trimestre"
onchange="afficherResultat()">

<option value="T1">
Trimestre 1
</option>

<option value="T2">
Trimestre 2
</option>

<option value="T3">
Trimestre 3
</option>

</select>

<div class="card">
<h3>Résultat personnel</h3>
<p id="resultat"></p>
</div>

<div class="card">
<h3>🏫 Appréciation générale</h3>
<p id="appreciationClasseEleve"></p>
</div>

<button onclick="activerNotifications()">
🔔 Me notifier lors de l'arrivée des résultats
</button>

<button onclick="location.reload()">
Déconnexion
</button>

</div>

<div id="admin" class="hidden">

<h2>Administration</h2>

<button onclick="ajouterEleve()">
➕ Ajouter un élève
</button>

<select id="choixEleve"></select>

<select id="choixTrimestre">
<option value="T1">Trimestre 1</option>
<option value="T2">Trimestre 2</option>
<option value="T3">Trimestre 3</option>
</select>

<textarea
id="texteResultat"
placeholder="Résultat individuel">
</textarea>

<button onclick="enregistrerResultat()">
💾 Enregistrer résultat
</button>

<div class="card">

<h3>🏫 Appréciation générale</h3>

<textarea
id="appreciationClasseAdmin"
placeholder="Appréciation générale">
</textarea>

<button
onclick="sauvegarderAppreciationClasse()">
📢 Enregistrer appréciation
</button>

</div>

<button onclick="supprimerEleve()">
🗑️ Supprimer élève
</button>

<button onclick="location.reload()">
Déconnexion
</button>

</div>

</div>

<div class="signature">
@classeConnecte
</div>

<script>

const ADMIN_CODE = "ADMIN2026";

let eleves =
JSON.parse(
localStorage.getItem("eleves")
) || {};

let appreciations =
JSON.parse(
localStorage.getItem("appreciations")
) || {
T1:"",
T2:"",
T3:""
};

let utilisateur = null;

function saveEleves(){
localStorage.setItem(
"eleves",
JSON.stringify(eleves)
);
}

function saveAppreciations(){
localStorage.setItem(
"appreciations",
JSON.stringify(appreciations)
);
}

async function activerNotifications(){

const permission =
await Notification.requestPermission();

if(permission !== "granted"){
alert("Notifications refusées");
return;
}

try{

const token =
await window.getToken(
window.messaging,
{
vapidKey:
"BAGYMaEGvunfhweGtpYcG0WqN-Q97q46x0MUK1m2J1GVyoAT4aKdaSdLzN7MbWqhCZe2mNQFLTuwwPQJYVoO5mo"
}
);

console.log(token);

localStorage.setItem(
"fcmToken",
token
);

alert(
"✅ Notifications activées !"
);

}catch(e){

console.error(e);

alert(
"Erreur notifications"
);

}

}

async function connexion(){

    const code =
    document.getElementById("code")
    .value.trim();

    if(code === ADMIN_CODE){

        document.getElementById("login")
        .classList.add("hidden");

        document.getElementById("admin")
        .classList.remove("hidden");

        chargerEleves();

        return;
    }

    const eleveRef =
    await getDoc(
        doc(
            db,
            "eleves",
            code
        )
    );

    if(eleveRef.exists()){

        const eleve =
        eleveRef.data();

        utilisateur = code;

        document.getElementById("login")
        .classList.add("hidden");

        document.getElementById("eleve")
        .classList.remove("hidden");

        document.getElementById("nomEleve")
        .innerText =
        "Bonjour " + eleve.nom;

        afficherResultat();

    }else{

        alert("Code incorrect");

    }

}

async function afficherResultat(){

    await chargerAppreciations();

    const t =
    document.getElementById(
        "trimestre"
    ).value;

    const eleveRef =
    await getDoc(
        doc(
            db,
            "eleves",
            utilisateur
        )
    );

    if(eleveRef.exists()){

        const eleve =
        eleveRef.data();

        document.getElementById(
            "resultat"
        ).innerText =
        eleve[t] ||
        "Aucun résultat";

    }

    document.getElementById(
        "appreciationClasseEleve"
    ).innerText =
    appreciations[t] ||
    "Aucune appréciation";

}

async function ajouterEleve(){

    const nom =
    prompt("Nom élève");

    if(!nom) return;

    const code =
    prompt("Code élève");

    if(!code) return;

    await setDoc(
        doc(
            db,
            "eleves",
            code
        ),
        {
            nom: nom,
            T1: "",
            T2: "",
            T3: ""
        }
    );

    alert("Élève ajouté");

    chargerEleves();

}

async function chargerEleves(){

    const select =
    document.getElementById(
        "choixEleve"
    );

    select.innerHTML = "";

    const snapshot =
    await getDocs(
        collection(
            db,
            "eleves"
        )
    );

    snapshot.forEach((docu)=>{

        const eleve =
        docu.data();

        select.innerHTML += `
            <option value="${docu.id}">
                ${eleve.nom} (${docu.id})
            </option>
        `;

    });

}
async function enregistrerResultat(){

    const eleve =
    document.getElementById(
        "choixEleve"
    ).value;

    const trim =
    document.getElementById(
        "choixTrimestre"
    ).value;

    const texte =
    document.getElementById(
        "texteResultat"
    ).value;

    await setDoc(
        doc(
            db,
            "eleves",
            eleve
        ),
        {
            [trim]: texte
        },
        {
            merge: true
        }
    );

    alert("Résultat enregistré");

}

function supprimerEleve(){

const eleve =
document.getElementById(
"choixEleve"
).value;

delete eleves[eleve];

saveEleves();

chargerEleves();

}

async function sauvegarderAppreciationClasse(){

    const trim =
    document.getElementById(
        "choixTrimestre"
    ).value;

    const texte =
    document.getElementById(
        "appreciationClasseAdmin"
    ).value;

    await setDoc(
        doc(
            db,
            "appreciations",
            trim
        ),
        {
            texte: texte
        }
    );

    alert(
        "Appréciation enregistrée"
    );

}

async function chargerAppreciations(){

    const T1 =
    await getDoc(
        doc(db,"appreciations","T1")
    );

    const T2 =
    await getDoc(
        doc(db,"appreciations","T2")
    );

    const T3 =
    await getDoc(
        doc(db,"appreciations","T3")
    );

    appreciations = {
        T1: T1.exists() ? T1.data().texte : "",
        T2: T2.exists() ? T2.data().texte : "",
        T3: T3.exists() ? T3.data().texte : ""
    };

}

  
</script>

</body>
</html>

</script>

</body>
</html>
